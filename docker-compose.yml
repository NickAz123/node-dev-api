services:
    api:
        build: .
        ports:
            - "9000:9000"
        environment:
            DB_HOST: db
            DB_PORT: 5432
            DB_NAME: devnodedb
            DB_USER: devnodeadmin
            DB_PASSWORD: devnodedbpassword
            PORT: 9000
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: devnodedb
            POSTGRES_USER: devnodeadmin
            POSTGRES_PASSWORD: devnodepassword
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U devadmin -d devnodedb"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    pgdata:
